[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-analysis"
version = "0.1.0"
description = "Local dream-journal parsing, retrieval, and analysis"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dream_analysis*", "cli*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
