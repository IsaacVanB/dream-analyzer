[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-analysis"
version = "0.1.0"
description = "Local dream-journal parsing, retrieval, and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9,<2",
    "matplotlib>=3.11.1,<4",
    "numpy>=2.5.1,<3",
    "ollama>=0.6.2,<1",
    "pandas>=3.0.5,<4",
    "plotly>=6.3,<7",
    "scikit-learn>=1.7,<2",
    "umap-learn>=0.5.9,<1",
    "hdbscan>=0.8.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
dream-analyzer = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dream_analysis*", "cli*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
